<!DOCTYPE html>
<html>
<head>
    <title>DoorsOS</title>
    <meta content="DoorsOS" property="og:title" />
	<meta content= "An attempt at copying the entire windows 11 operating system in html by myself." property="og:description" />
    <meta charset="UTF-8"/>
    <link rel="stylesheet" href="style.css"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <div id="desktop">
        <div id="icons" class="medium">
            <div class="icon" title-data="Recycle Bin">
                <img src="assets/recycle.png" alt="Recycle Bin"/>
                <p>Recycle Bin</p>
            </div>
            <p></p>
            <div class="icon web" id="garry" title-data="Garry's Mod">
                <img src="apps/garry.png" alt="Garry's Mod"/>
                <p>Garry's Mod</p>
            </div>
            <p></p>
            <div class="icon app" id="peter" title-data="Race To The Clam">
                <img src="apps/peter.png" alt="Petah"/>
                <p>Race To The Clam</p>
            </div>
        </div>
        <div id="taskbar">
            <div id="start-button" class="taskbar-icon popup" title-data="Start">
                <img src="assets/start.png" alt="Start"/>
            </div>
            <div id="search-button" class="blank popup">
                <svg id="search-icon"
                    fill="white"
                    height="15px"
                    width="15px"
                    version="1.1"
                    xmlns="http://www.w3.org/2000/svg"
                    xmlns:xlink="http://www.w3.org/1999/xlink" 
                    viewBox="0 0 490.4 490.4" 
                    xml:space="preserve">
                    <g>
                        <path 
                            d="M484.1,454.796l-110.5-110.6c29.8-36.3,47.6-82.8,47.6-133.4c0-116.3-94.3-210.6-210.6-210.6S0,94.496,0,210.796
                            s94.3,210.6,210.6,210.6c50.8,0,97.4-18,133.8-48l110.5,110.5c12.9,11.8,25,4.2,29.2,0C492.5,475.596,492.5,463.096,484.1,454.796z
                            M41.1,210.796c0-93.6,75.9-169.5,169.5-169.5s169.6,75.9,169.6,169.5s-75.9,169.5-169.5,169.5S41.1,304.396,41.1,210.796z"
                        />
                    </g>
                </svg>
                <p>Search</p>
            </div>
            <div id="taskbar-apps">
                <div class="taskbar-icon idk pinned" >
                    <img src="assets/task-view.png" alt="Task View"/>
                </div>
                <div id="explorer" class="taskbar-icon app pinned" title-data="File Explorer">
                    <img src="assets/explorer.png" alt="File Explorer"/>
                    <div></div>
                </div>
                <div id="store" class="taskbar-icon app pinned" title-data="Microsoft Store">
                    <img src="assets/store.png" alt="Microsoft Store"/>
                    <div></div>
                </div>
            </div>
            <div id="taskbar-icons">
                <div class="taskbar-icon popup" id="controls-button">
                    <pre id="ethernet">&#59449</pre>
                    <pre id="sound">&#57693</pre>
                </div>
                <div class="taskbar-icon popup" id="clock-button">
                    <div>
                        <p id="time">4:20 PM</p>
                        <p id="date">6/9/1969</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script type="text/javascript" src="script.js"></script>
</body>
</html>
