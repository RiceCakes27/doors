    <script>
        function openDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open("Explorer", 1);

                request.onupgradeneeded = () => {
                    const db = request.result;
                    db.createObjectStore("files");
                };

                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
            });
        }
        function createFolder(location, name) {
            document.getElementById(location).insertAdjacentHTML("beforeend", `<p>${name}<p>`)
        }
        (async () => {
            const db = await openDB();
            const tx = db.transaction("files", "readwrite");
            const storedSettings = tx.objectStore("files");
            //storedSettings.put(`url(${reader.result})`, 'lastpicture');
            await tx.complete;
        })();
    </script>
